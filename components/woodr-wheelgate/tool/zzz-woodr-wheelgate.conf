# Wheel gate (woodr-wheelgate): woodr-wheelgate.so in the HMI, loaded only if woodr-wheelgate-guard.service puts /run/woodr-wheelgate.env there
# (named to be read after the controller gate's drop-in: the file it reads lists that library too)
[Unit]
Wants=woodr-wheelgate-guard.service woodr-wheelgate-check.service
After=woodr-wheelgate-guard.service

[Service]
EnvironmentFile=-/run/woodr-wheelgate.env
